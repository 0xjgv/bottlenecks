<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Map how work flows through your startup. Find what slows it down."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Bottlenecks: find what slows your startup down</title>

    <!-- Social preview. Relative URLs only: this build has no fixed origin. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bottlenecks" />
    <meta property="og:title" content="Bottlenecks" />
    <meta
      property="og:description"
      content="Map how work flows through your startup. Find what slows it down."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Bottlenecks" />
    <meta
      name="twitter:description"
      content="Map how work flows through your startup. Find what slows it down."
    />
  </head>
  <body>
    <!--
      The app is client rendered, so a crawler that does not run JavaScript
      sees an empty document and a reader with JavaScript off sees nothing at
      all. This heading and paragraph are the one piece of the page that does
      not need the bundle: they name what this is in the markup itself.

      Styled inline rather than through .sr-only in index.css, because that
      stylesheet arrives with the bundle and the text would be visible until
      it did. Hidden from the accessibility tree is NOT wanted here: a screen
      reader landing on the page should hear the name before the canvas
      loads, which is the same reason the h1 is a real heading rather than a
      meta tag.
    -->
    <div
      style="
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      "
    >
      <h1>Bottlenecks: find what slows your startup down</h1>
      <p>
        Map how work flows through your startup: teams, backlogs, approvers and
        handoffs. Send work through it and watch where it piles up. Every number comes
        from simulating individual work items rather than a formula. It runs entirely in
        your browser.
      </p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
